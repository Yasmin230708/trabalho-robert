<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anúncio iPhone 15 Pro</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Inter:wght@400;700&display=swap');

    body {
        margin: 0;
        background-color: #d42c8c;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: Arial, sans-serif;
    }

    /* Container Quadrado como a imagem original */
    .container {
        background: white;
        width: 650px;
        padding: 30px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* MEGA PROMOÇÃO */
    .topo-titulo {
        font-family: 'Playfair Display', serif;
        color: #e0322b;
        font-size: 50px;
        letter-spacing: 4px;
        margin: 0;
        text-transform: uppercase;
    }

    /* Subtítulo */
    .topo-sub {
        color: #e0322b;
        font-size: 22px;
        text-align: center;
        margin: 10px 0;
        line-height: 1.2;
    }

    /* Nome do Produto */
    .produto-nome {
        font-size: 80px;
        font-weight: bold;
        margin: 5px 0 20px 0;
        letter-spacing: -2px;
    }

    /* Miolo do anúncio (Balões + Texto vs iPhone) */
    .conteudo-principal {
        display: flex;
        width: 100%;
        justify-content: space-between;
        align-items: flex-end; /* Alinha os itens na base */
    }

    .coluna-esquerda {
        width: 45%;
        text-align: left;
        display: flex;
        flex-direction: column;
    }

    .chamada-rosa {
        color: #d42c8c;
        font-size: 24px;
        line-height: 1.1;
        margin-bottom: 10px;
    }

    .contato {
        font-size: 18px;
        color: black;
        margin-bottom: 20px;
    }

    .baloes {
        width: 220px; /* Tamanho grande para igualar a imagem */
    }

    .coluna-direita {
        width: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .iphone-img {
        width: 320px;
        margin-bottom: 15px;
    }

    /* Preço exatamente abaixo do iPhone */
    .preco-box {
        text-align: center;
        color: #e0322b;
        line-height: 1;
    }

    .por-apenas {
        font-size: 34px;
        display: block;
    }

    .valor {
        font-size: 54px;
        font-weight: 400;
        display: block;
    }
</style>
</head>
<body>

<div class="container">
    <h1 class="topo-titulo">MEGA PROMOÇÃO</h1>
    
    <div class="topo-sub">
        A solução que você procurava, com o<br>desconto que você precisava!
    </div>

    <div class="produto-nome">Iphone 15 pro</div>

    <div class="conteudo-principal">
        <div class="coluna-esquerda">
            <div class="chamada-rosa">A praticidade que<br>você procura</div>
            <div class="contato">Contato 42984116513</div>
            <img src="image 2 (2).png" alt="Balões" class="baloes">
        </div>

        <div class="coluna-direita">
            <img src="image 1.png" alt="iPhone 15 Pro" class="iphone-img">
            <div class="preco-box">
                <span class="por-apenas">Por apenas</span>
                <span class="valor">R$2.999,99</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
